spring.application.name=cafetin

# Database configuration for local and cloud environments
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafetin}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port for local development or cloud deployment
server.port=${PORT:8085}

# Swagger
# http://localhost:8085/swagger-ui/index.html