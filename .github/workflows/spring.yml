name: Spring Boot CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repo
      uses: actions/checkout@v3

    - name: Instalar Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Dar permisos a mvnw
      run: chmod +x mvnw

    - name: Compilar proyecto
      run: ./mvnw clean install

    - name: Ejecutar tests
      run: ./mvnw test
